spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/study_planner}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Custom settings for this app (not Spring's own).
app:
  jwt:
    # HMAC signing key, at least 32 characters. Comes from an environment
    # variable so it is never committed to GitHub.
    secret: ${JWT_SECRET}
    # How long a token stays valid after login.
    expiration-minutes: 60
